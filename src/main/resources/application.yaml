spring:
  application:
    name: evaluacion

  datasource:
    url: jdbc:h2:mem:ccpmdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jwt:
    secret: "9a8f7e6d5c4b3a210987654321abcdef9a8f7e6d5c4b3a210987654321abcdef"
    expiration: 86400000