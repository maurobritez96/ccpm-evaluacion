spring:
  application:
    name: evaluacion

  datasource:
    url: jdbc:h2:mem:ccpmdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET:miClaveSecretaParaDesarrolloLocalConLargoSuficiente123456}
  expiration-minutes: 60